<style>
/* One screen, studio flash on obsidian: the laurel is the only object in the room. */
:root {
  --obsidian: #070707;
  --smoke: #1A1A1C;
  --line: #2E2E32;
  --marble: #E8E4DC;
  --marble-muted: #C9C5BD;
  --stone: #A8A49C;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --ui: "Geist", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.22, .61, .36, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--obsidian);
  color: var(--marble);
  font: 400 16px/1.5 var(--ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
.stage {
  position: relative;
  height: 100%;
  min-height: 100%;
  display: grid;
  grid-template-rows: 1fr auto;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  isolation: isolate;
}
/* the flash: a soft pool of light behind the mark, falling off to black */
.stage::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(ellipse 46% 38% at 50% 40%, rgba(232, 228, 220, .075), transparent 70%),
    radial-gradient(ellipse 120% 90% at 50% 40%, var(--smoke), var(--obsidian) 72%);
}
main {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: clamp(20px, 3.4vh, 32px);
  min-height: 0;
}
.mark { width: clamp(128px, 22vh, 196px); height: auto; overflow: visible; }
.word { width: clamp(150px, 20vh, 210px); height: auto; margin-top: -4px; }
.motto {
  margin: -6px 0 0;
  font: 400 13px/1 var(--display);
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--stone);
}
.tagline {
  margin: 0;
  font: italic 400 clamp(20px, 2.6vh, 24px)/1.15 var(--display);
  color: var(--marble-muted);
  text-wrap: balance;
}
.note {
  margin: 0;
  font-size: 14px;
  line-height: 1.45;
  color: var(--stone);
}
.cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  height: 52px;
  padding: 0 26px;
  border-radius: 26px;
  background: var(--marble);
  color: var(--obsidian);
  font: 600 15px/1 var(--ui);
  text-decoration: none;
  transition: transform .35s var(--ease), background-color .35s var(--ease);
}
.cta:hover { background: #F4F1EA; transform: translateY(-1px); }
.cta:focus-visible { outline: 1px solid var(--marble); outline-offset: 4px; }
.cta svg { width: 16px; height: 16px; }
footer {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font: 400 11px/1.2 var(--mono);
  letter-spacing: .08em;
  color: var(--stone);
}
footer a { color: inherit; text-decoration: none; }
footer a:hover, footer a:focus-visible { color: var(--marble); }

/* entrance: the laurel grows pair by pair from the bottom, each pair a rung, then XXV */
.js .leaves path, .js .stems, .js .xxv, .js .reveal { opacity: 0; }
.js.go .leaves path { animation: rise .5s var(--ease) both; animation-delay: var(--d); }
.js.go .stems { animation: fade .9s var(--ease) both .1s; }
.js.go .xxv { animation: fade .6s var(--ease) both 1.05s; }
.js.go .reveal { animation: rise .6s var(--ease) both; animation-delay: var(--d); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.leaves path { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: reduce) {
  .js .leaves path, .js .stems, .js .xxv, .js .reveal { opacity: 1; animation: none !important; }
}
@media (max-height: 560px) {
  .mark { width: 104px; }
  .word { width: 132px; }
  main { gap: 14px; }
}
</style>
